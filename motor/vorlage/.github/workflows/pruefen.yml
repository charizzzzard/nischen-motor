name: Prüfen

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Motor installieren (Version aus .motor-version)
        env:
          # Lese-Token für das private Repo charizzzzard/nischen-motor (Repository-Secret MOTOR_TOKEN)
          MOTOR_TOKEN: ${{ secrets.MOTOR_TOKEN }}
        run: pip install "nischen-motor @ git+https://x-access-token:${MOTOR_TOKEN}@github.com/charizzzzard/nischen-motor@$(cat .motor-version)"
      - name: Bauen und prüfen
        run: motor check
